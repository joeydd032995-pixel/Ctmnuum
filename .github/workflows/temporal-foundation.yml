name: Temporal Foundation

on:
  push:
    branches:
      - feat/foundation-temporal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # [FND-REPO-G3] format, lint and typecheck run before any unit test.
  quality:
    uses: ./.github/workflows/quality.yml

  temporal-contracts:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # uv resolves the lockfile, so its own version is necessarily pinned here
      # rather than in uv.lock -- it is the one dependency that cannot come from
      # the lock it produces.
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.8.17

      # [FND-REPO-G2] the SDK version comes from uv.lock. It was installed here
      # with an ad-hoc `pip install temporalio==1.31.0`, which is a second place
      # the pin could drift from pyproject.toml -- and CLAUDE.md records that
      # version as part of the contract rather than a floor.
      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run Temporal Foundation contract tests
        run: uv run python -m unittest discover -s tests/temporal -p 'test_*.py' -v
