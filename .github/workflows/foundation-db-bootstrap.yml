name: Foundation DB Bootstrap Contract

on:
  push:
    branches:
      - feat/foundation-phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-bootstrap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify source-backed database bootstrap invariants
        run: python -m unittest tests.unit.test_database_bootstrap_contract
