[project]
name = "ctmnuum"
version = "0.0.0"
description = "Continuum persistent autonomous reasoning environment"
requires-python = "==3.13.*"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
